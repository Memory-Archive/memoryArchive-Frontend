name: smart_memories
description: "Smart Memories & Connections Platform — Flutter client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  get_it: ^8.0.3
  go_router: ^17.0.0
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.6.0
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true

  # The design uses two Google Fonts. Download the .ttf files, put them in
  # assets/fonts/, then uncomment this block. Until then the app falls back to
  # the platform font (see README, "Missing from the design").
  #
  # fonts:
  #   - family: DM Sans
  #     fonts:
  #       - asset: assets/fonts/DMSans-Regular.ttf
  #       - asset: assets/fonts/DMSans-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/DMSans-Bold.ttf
  #         weight: 700
  #   - family: Fraunces
  #     fonts:
  #       - asset: assets/fonts/Fraunces-SemiBold.ttf
  #         weight: 600
